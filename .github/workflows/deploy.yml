name: Deploy

on:
  push:
    branches: [main]

env:
  PROJECT_ID: test-run-api-jordonkloiber
  REGION: us-central1
  SERVICE: test-run-api
  IMAGE: us-central1-docker.pkg.dev/test-run-api-jordonkloiber/test-run-api-image/server

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/796881713635/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@test-run-api-jordonkloiber.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: docker build -t ${{ env.IMAGE }}:${{ github.sha }} .

      - name: Push image
        run: docker push ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }}
